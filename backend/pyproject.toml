[project]
name = "api"
requires-python = ">=3.13"
version = "0.1.0"
dependencies = [
    "django>=6.1.3",
    "psycopg[binary]>=3.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.28",
    "django-unfold>=0.110.1",
    "requests>=2.32.5",
    "cloudinary>=1.47.0",
    "pillow>=11.0.0",
    "sentry-sdk[django]>=2.0.0",
    "celery[redis]>=5.4,<6",
    "gunicorn>=21.2",
    "uvicorn>=0.54.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9.2.0",
    "pytest-django>=4.9.0",
    "pytest-factoryboy>=2.7.0",
    "ruff>=0.17.5",
]

[tool.ruff]
fix = true
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "C901",    # too complex
    "PLR0915", # too many statements
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 70

[tool.pytest.ini_options]
filterwarnings = "ignore"
addopts = "--strict-config --strict-markers --ds=api.settings"
